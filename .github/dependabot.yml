# Dependabot keeps the dev toolchain and the CI actions current. The package ships no
# runtime dependencies (n8n verification rule), so every npm update here is build/test only.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      dev-toolchain:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
